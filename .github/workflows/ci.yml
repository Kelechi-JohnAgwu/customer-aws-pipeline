
name: Customer R Pipeline CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check R syntax
        run: Rscript -e 'parse(file = "s3_to_rds.R")'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: {{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Docker login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REPOSITORY: 438424052683.dkr.ecr.eu-north-1.amazonaws.com/customer-r-pipeline
        run: |
          docker build -t "$ECR_REPOSITORY:4.0" .
          docker push "$ECR_REPOSITORY:4.0"
